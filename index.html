<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mind 1.2.2</title><h1>Mind 1.2.2</h1><p>Tu segundo cerebro en una carpeta.</p><p><a href="estable/Mind-1.2.2-Windows.zip">Descargar Mind para Windows</a></p><p>En PowerShell de Windows, copia y ejecuta:</p><pre><code id="comando">irm https://aldo-boop.github.io/Mind/instalar.ps1 | iex</code></pre><button type="button" id="copiar">Copiar comando</button><span id="estado" role="status" aria-live="polite"></span><p><a href="https://github.com/aldo-boop/Mind#instalar">Cómo instalar y actualizar</a></p><script>document.getElementById("copiar").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(document.getElementById("comando").textContent);document.getElementById("estado").textContent=" Comando copiado";}catch{document.getElementById("estado").textContent=" Selecciona y copia el comando de arriba.";}});</script></html>
